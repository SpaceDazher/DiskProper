# =============================================================================
# MrProper — обновление зависимостей.
#
# Спека: §9.1 ADR-010 (репозиторий публичный) и §8 Этап 0 (сборка на голом
# MSVC, без сторонних библиотек).
#
# У проекта нет сторонних зависимостей: ни vcpkg, ни FetchContent, ни NuGet/
# npm/pip-манифестов. Экосистемы, которым нечего обновлять, здесь намеренно
# не перечислены: для них Dependabot завершает прогон ошибкой
# «dependency file not found», а не пустым отчётом — такой шум только учит
# не читать расписание.
#
# Единственная живая экосистема — GitHub Actions: обновление actions/checkout,
# upload/download-artifact и anchore/sbom-action меняет поведение ворот из
# .github/workflows/ci.yml, поэтому оно идёт через PR с зелёным CI, а не
# молча в master.
# =============================================================================
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Понедельник утром: разбор пакета PR в начале недели, до релиза.
      # В отличие от cron в workflow, здесь timezone поддерживается Dependabot
      # штатно, поэтому время указано по Москве, а не в UTC.
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Moscow"
    # Пять открытых PR — потолок, дальше Dependabot перестаёт предлагать новое,
    # чтобы очередь не превращалась в свалку. При этом обновления мажорных
    # версий ограничены одним PR: они меняют поведение ворот и требуют разбора.
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "ci(deps)"
    groups:
      # Миноры и патчи экосистемы Actions связаны между собой: обновление
      # checkout тянет за собой upload/download-artifact, а рассинхрон версий
      # этих действий между собой ломает шаги. Одним PR дешевле проверить,
      # чем тремя.
      # Мажоры сюда НЕ входят намеренно: anchore/sbom-action@v0 → следующий
      # мажор меняет контракт входов, и такой переход должен быть отдельным
      # решением с прочитанным diff, а не побочным эффектом раскладки PR.
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
